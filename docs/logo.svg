<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0f2235"/>
  <rect width="64" height="4" fill="#c0392b"/>
  <!-- A recorded head path: samples along a curve, replayed forward. -->
  <path d="M9 44 C 20 20, 30 20, 38 30 S 52 40, 55 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="9" cy="44" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="24" cy="24" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="38" cy="30" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <!-- The record point. -->
  <circle cx="24" cy="24" r="3.6" fill="#c0392b"/>
  <!-- Replay: an orange play head at the end of the path. -->
  <path d="M50 15 L 60 21 L 50 27 Z" fill="#e67e22"/>
</svg>
